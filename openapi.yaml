                  comparisons:
                    type: array
                    items: { $ref: '#/components/schemas/PairwiseChoice' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: savePairwiseComparison
      tags: [Judging]
      summary: Save or replace the winner for an assigned project pair
      description: Requires a judge session and JUDGING event state. Both projects must be assigned to this judge and pass track-scope checks.
      requestBody:
        required: true
