    get:
      operationId: listPairwiseComparisons
      tags: [Judging]
      summary: Read the judge's assigned project pairs and saved choices
      description: Requires a judge session. Projects are constrained to assignments and track scope. Saved choices contain the judge's latest winner for each pair.
      responses:
