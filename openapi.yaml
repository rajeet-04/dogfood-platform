    get:
      operationId: downloadJudgeApplicationAttachment
      tags: [Assets and exports]
      summary: Download an application attachment when authorized
      responses:
        '200': { description: Original attachment bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: '#/components/responses/ApiError' }
