  /api/v1/events/{eventId}/prizes/{prizeId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: prizeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePrize
      tags: [Prizes and certificates]
      summary: Update a prize
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrizePatch' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deletePrize
      tags: [Prizes and certificates]
      summary: Delete a prize
      responses:
        '204': { description: Prize deleted }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/certificates:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listCertificates
      tags: [Prizes and certificates]
      summary: List issued certificates
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: issueCertificates
      tags: [Prizes and certificates]
      summary: Issue certificates for published results
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: revokeCertificates
      tags: [Prizes and certificates]
      summary: Revoke the event's issued certificates
      description: Requires event configure permission. Returns { revoked } with the number of certificates revoked.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/certificates/{certificateId}:
    parameters:
      - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCertificate
      tags: [Prizes and certificates]
      summary: Read a public certificate
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/exports/{name}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: name, in: path, required: true, description: Export key; an optional .csv suffix is accepted., schema: { type: string } }
    get:
      operationId: downloadEventExport
      tags: [Assets and exports]
      summary: Download an authorized CSV export
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/bulk/projects:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: exportProjectArchive
      tags: [Assets and exports]
      summary: Export an event's projects and revision history
      description: Organizer-only. JSON is the default format; CSV contains one project per row, with the revision list serialized as JSON in revisions_json. This transfers references to existing same-event teams, tracks, and image assets, not those entities or binary files.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: format
          description: Export format; defaults to json.
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Project archive in the requested format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectArchive' }
            text/csv:
              schema: { type: string, description: CSV with project_id, team_id, slug, state, submitted_at, locked_at, created_at, current_revision_id, and revisions_json columns. }
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename is set for CSV downloads.
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: importProjectArchive
      tags: [Assets and exports]
      summary: Import projects and revision history from an archive
      description: Organizer-only, create-only import, accepted only before judging starts. Imports are rejected in JUDGING, RESULTS_READY, PUBLISHED, and ARCHIVED so rankings and published entrants cannot be changed afterward; there is no restore-mode exception. The request is limited to 10 MiB, 1,000 projects, and 5,000 revisions. Referenced teams, tracks, and image assets must already exist in this event; events, teams, and binary assets are not imported. Existing project IDs cause a conflict. A successful import appends a projects.bulk_import audit event and queues matching webhook deliveries.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        description: Version 1 archive JSON or the documented project archive CSV format. CSV revisions_json is a JSON-encoded revision array.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectArchive' }
          text/csv:
            schema: { type: string, description: CSV with the project archive header and a JSON revisions_json field. }
      responses:
        '201':
          description: Number of projects created
          content:
            application/json:
              schema:
                type: object
                required: [imported]
                properties:
                  imported: { type: integer, minimum: 0, maximum: 1000 }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-applications/{applicationId}/attachment:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadJudgeApplicationAttachment
      tags: [Assets and exports]
      summary: Download an application attachment when authorized
      responses:
        '200': { description: Original attachment bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/webhooks:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listEventWebhooks
      tags: [Webhooks]
      summary: List webhook endpoints and deliveries
      description: Organizer-only. Endpoint signing secrets are never returned.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createEventWebhook
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: Organizer-only. The generated signing secret is returned once in this response. URLs must be public HTTPS endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, minLength: 1, maxLength: 2048, format: uri }
                eventTypes: { type: array, minItems: 1, maxItems: 64, default: ['*'], items: { type: string, minLength: 1, maxLength: 96 } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/webhooks/{endpointId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateEventWebhook
      tags: [Webhooks]
      summary: Enable, disable, or rotate a webhook endpoint
      description: Organizer-only. Provide enabled or rotateSecret=true; a rotated secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              anyOf:
                - required: [enabled]
                - required: [rotateSecret]
                  properties: { rotateSecret: { const: true } }
              properties:
                enabled: { type: boolean }
                rotateSecret: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteEventWebhook
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: Organizer-only.
      responses:
        '200': { description: Deleted endpoint, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { const: true } } } } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/webhooks/dispatch:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: dispatchEventWebhooks
      tags: [Webhooks]
      summary: Dispatch due webhook deliveries
      description: Organizer-only. Claims and attempts due deliveries up to the requested limit, with a default of 20 and maximum of 100. Failed deliveries retry with bounded backoff and eventually become dead letters.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/health:
    get:
      operationId: healthCheck
      tags: [Operations]
      summary: Liveness check
      security: []
      responses:
        '200': { description: Process is responding, content: { application/json: { schema: { type: object, required: [status], properties: { status: { const: ok } } } } } }
  /api/ready:
    get:
      operationId: readinessCheck
      tags: [Operations]
      summary: Readiness and database migration check
      security: []
      responses:
        '200': { description: Database and migrations are ready, content: { application/json: { schema: { type: object, required: [status, database, migrations], properties: { status: { const: ready }, database: { const: ok }, migrations: { const: applied } } } } } }
        '503': { description: Database or migrations are unavailable, content: { application/json: { schema: { type: object, required: [status, database], properties: { status: { const: unavailable }, database: { const: unreachable } } } } } }

  /.well-known/dogfood-judge-records.json:
    get:
      operationId: getJudgeRecordIssuerKeys
      tags: [Judging]
      summary: Published trust anchor for signed judge records
      description: Public. Returns the issuer origin, the active Ed25519 signing key (SPKI PEM and SHA-256 SPKI fingerprint, or null when signing is not configured), and every trusted signer fingerprint. Verifiers fetch this over HTTPS from the issuer origin (or pin a fingerprint out of band) and check records with scripts/verify-judge-record.ts.
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/sign-out:
    post:
      operationId: signOutAccounts
      tags: [Auth]
      summary: Revoke one saved account session or all of them
      description: Revokes sessions server side (unlike logout, which only clears the browser cookie). A token must be the active session or present in the HttpOnly dogfood_accounts list. Updates dogfood_accounts and switches the active session to the next saved account, or clears it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { oneOf: [ { type: object, required: [token], additionalProperties: false, properties: { token: { type: string, minLength: 1 } } }, { type: object, required: [all], additionalProperties: false, properties: { all: { const: true } } } ] }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/notifications/read:
    post:
      operationId: markAllNotificationsRead
      tags: [Events]
      summary: Mark all of the caller's notifications read
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/notifications/{notificationId}/read:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markNotificationRead
      tags: [Events]
      summary: Mark one of the caller's notifications read
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-applications:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: getJudgeApplications
      tags: [Judging]
      summary: Read the caller's judge application, or all applications for organizers
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: applyAsJudge
      tags: [Judging]
      summary: Apply to judge the event
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { rationale: { type: string, maxLength: 2000 } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: withdrawJudgeApplication
      tags: [Judging]
      summary: Withdraw the caller's pending judge application
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-applications/{applicationId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: decideJudgeApplication
      tags: [Judging]
      summary: Approve or reject a judge application
      description: Requires organizer permission. Approval grants the JUDGE role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judges/{userId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deactivateJudge
      tags: [Judging]
      summary: Deactivate a judge's event membership
      description: Requires organizer permission.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/rubrics:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listRubrics
      tags: [Judging]
      summary: List rubric versions and criteria
      description: Requires organizer permission.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createRubric
      tags: [Judging]
      summary: Create the next rubric version
      description: Requires event configure permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 120 } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/rubrics/{rubricId}/criteria:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: rubricId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addRubricCriterion
      tags: [Judging]
      summary: Add a weighted criterion to a rubric
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, weight, minScore, maxScore], properties: { name: { type: string, minLength: 1, maxLength: 120 }, description: { type: string }, weight: { type: number }, minScore: { type: number }, maxScore: { type: number }, optional: { type: boolean } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/rubrics/{rubricId}/activate:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: rubricId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: activateRubric
      tags: [Judging]
      summary: Make a rubric version the active one
      description: Requires event configure permission; criterion weights must be valid.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/evaluations/{assignmentId}/start:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startEvaluation
      tags: [Judging]
      summary: Start (or resume) the assigned judge's evaluation
      description: Only the assigned judge. Idempotent for an evaluation already in progress.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/evaluations/{assignmentId}/reopen:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reopenEvaluation
      tags: [Judging]
      summary: Reopen a submitted evaluation for revision
      description: Only the assigned judge, while judging is open. Returns 409 unless the evaluation is SUBMITTED; locked evaluations cannot be reopened.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/evaluations/{assignmentId}/lock:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: lockEvaluation
      tags: [Judging]
      summary: Lock one submitted evaluation
      description: Requires event configure permission. Returns 409 unless the evaluation is SUBMITTED.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/bulk/evaluations/lock:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: lockAllEvaluations
      tags: [Judging]
      summary: Lock every submitted evaluation in the event
      description: Requires event configure permission. In-progress evaluations are left untouched. Returns { locked } with the count.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/bulk/projects/lock:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: lockAllProjects
      tags: [Teams and projects]
      summary: Lock every submitted project after the submission deadline
      description: Requires event configure permission. Returns { locked } with the count.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/rankings/{snapshotId}/publish:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: publishRankingSnapshot
      tags: [Judging]
      summary: Publish a score-based ranking snapshot
      description: Requires organizer permission. Moves the event to RESULTS_READY.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dogfood_session
  parameters:
    eventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    projectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    Evaluation:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              scores:
                type: array
                maxItems: 200
                items: { type: object, required: [criterionId, score], properties: { criterionId: { type: string, minLength: 1 }, score: { type: number }, comment: { type: [string, 'null'] } } }
              overallComment: { type: [string, 'null'], maxLength: 2000 }
    ApiError:
      description: Authentication, permission, validation, conflict, or server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    EventMembership:
      type: object
      required: [id, eventId, userId, role, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [ORGANIZER, JUDGE, PARTICIPANT] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AddEventMember:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { type: string, enum: [JUDGE, ORGANIZER] }
    ChangeEventMemberRole:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ORGANIZER, JUDGE, PARTICIPANT] }
    AuthUser:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        isPlatformAdmin: { type: boolean }
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
    RegisterAccount:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, minLength: 1 }
    LoginAccount:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    SwitchAccount:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, description: Raw session token from a previously saved dogfood_accounts session; accepted only if present in that cookie. }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    EventSummary:
      type: object
      required: [id, slug, name, description, timezone, state, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        timezone: { type: string }
        state: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    CreateEvent:
      type: object
      required: [slug, name, timezone]
      properties:
        slug: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9-]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        registrationOpensAt: { type: [string, 'null'], format: date-time }
        registrationClosesAt: { type: [string, 'null'], format: date-time }
        submissionOpensAt: { type: [string, 'null'], format: date-time }
        submissionClosesAt: { type: [string, 'null'], format: date-time }
        judgingOpensAt: { type: [string, 'null'], format: date-time }
        judgingClosesAt: { type: [string, 'null'], format: date-time }
    UpdateEventDetails:
      type: object
      required: [description, websiteUrl, prizeInfo, timeline, schedule, rules, maxTeamSize]
      properties:
        description: { type: [string, 'null'], maxLength: 5000 }
        websiteUrl: { type: [string, 'null'], maxLength: 500 }
        prizeInfo: { type: [string, 'null'], maxLength: 2000 }
        timeline: { type: [string, 'null'], maxLength: 2000 }
        schedule: { type: [string, 'null'], maxLength: 2000 }
        rules: { type: [string, 'null'], maxLength: 5000 }
        maxTeamSize: { type: [integer, 'null'], minimum: 2, maximum: 100 }
    SignedJudgeRecord:
      type: object
      required: [id, payload, algorithm, keyFingerprint, publicKey, signature, payloadHash, issuedAt, signatureValid, issuerTrusted]
      properties:
        id: { type: string, format: uuid }
        payload:
          type: object
          required: [version, recordId, eventSlug, eventName, judgeDisplayName, lockedEvaluations, firstLockedAt, lastLockedAt]
          properties:
            version: { const: dogfood.judge-participation.v1 }
            recordId: { type: string, format: uuid }
            eventSlug: { type: string }
            eventName: { type: string }
            judgeDisplayName: { type: string }
            lockedEvaluations: { type: integer, minimum: 1 }
            firstLockedAt: { type: string, format: date-time }
            lastLockedAt: { type: string, format: date-time }
        algorithm: { const: Ed25519 }
        keyFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 fingerprint of the SPKI public key }
        publicKey: { type: string, description: PEM-encoded Ed25519 SubjectPublicKeyInfo key }
        signature: { type: string, contentEncoding: base64url, description: Ed25519 signature over the canonical JSON payload }
        payloadHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        issuedAt: { type: string, format: date-time }
        signatureValid: { type: boolean, const: true }
        issuerTrusted: { type: boolean, description: True only when keyFingerprint matches a deployment trust pin }
    SignedJudgeRecordRevocationReceipt:
      type: object
      required: [payload, payloadHash, algorithm, keyFingerprint, publicKey, signature, revokedAt, signatureValid, issuerTrusted]
      properties:
        payload:
          type: object
          required: [version, recordId, eventSlug, status, revokedAt]
          properties:
            version: { const: dogfood.judge-participation-revocation.v1 }
            recordId: { type: string, format: uuid }
            eventSlug: { type: string }
            status: { const: revoked }
            revokedAt: { type: string, format: date-time }
        payloadHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        algorithm: { const: Ed25519 }
        keyFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        publicKey: { type: string, description: PEM-encoded Ed25519 SubjectPublicKeyInfo key }
        signature: { type: string, contentEncoding: base64url, description: Ed25519 signature over the canonical JSON payload }
        revokedAt: { type: string, format: date-time }
        signatureValid: { type: boolean, const: true }
        issuerTrusted: { type: boolean }
    PairwiseChoice:
      type: object
      required: [winnerProjectId, loserProjectId]
      properties:
        winnerProjectId: { type: string, format: uuid }
        loserProjectId: { type: string, format: uuid }
    ProjectArchive:
      type: object
      required: [format, version, eventId, projects]
      properties:
        format: { const: dogfood-projects }
        version: { const: 1 }
        eventId: { type: string, format: uuid }
        projects:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ProjectArchiveProject' }
    ProjectArchiveProject:
      type: object
      required: [id, teamId, slug, state, submittedAt, lockedAt, createdAt, currentRevisionId, revisions]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        slug: { type: string, minLength: 1, maxLength: 120 }
        state: { type: string, enum: [DRAFT, SUBMITTED, LOCKED] }
        submittedAt: { type: [string, 'null'], format: date-time }
        lockedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        currentRevisionId: { type: string, format: uuid }
        revisions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ProjectArchiveRevision' }
    ProjectArchiveRevision:
      type: object
      required: [id, revisionNumber, createdAt, title, tagline, description, repositoryUrl, liveUrl, demoVideoUrl, thumbnailAssetId, trackId, techTags, customAnswers, questionSnapshot, images]
      properties:
        id: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        title: { type: string, maxLength: 120 }
        tagline: { type: [string, 'null'], maxLength: 280 }
        description: { type: string, maxLength: 4000 }
        repositoryUrl: { type: [string, 'null'], format: uri }
        liveUrl: { type: [string, 'null'], format: uri }
        demoVideoUrl: { type: [string, 'null'], format: uri }
        thumbnailAssetId: { type: [string, 'null'], format: uuid }
        trackId: { type: [string, 'null'], format: uuid }
        techTags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        customAnswers: { type: object, additionalProperties: { type: string, maxLength: 4000 } }
        questionSnapshot:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, prompt, required, visibility, order]
            properties:
              id: { type: string, format: uuid }
              prompt: { type: string, minLength: 1, maxLength: 500 }
              required: { type: boolean }
              visibility: { type: string, enum: [PUBLIC, ORGANIZER_ONLY] }
              order: { type: integer, minimum: 0 }
        images:
          type: array
          maxItems: 10
          items:
            type: object
            required: [assetId, position]
            properties:
              assetId: { type: string, format: uuid }
              position: { type: integer, minimum: 0 }
    CreateProject:
      type: object
      required: [teamId]
      properties:
        teamId: { type: string }
        slug: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 120 }
        tagline: { type: [string, 'null'], maxLength: 280 }
        description: { type: string, maxLength: 4000 }
        repositoryUrl: { type: [string, 'null'], format: uri }
        liveUrl: { type: [string, 'null'], format: uri }
        demoVideoUrl: { type: [string, 'null'], format: uri }
        techTags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        trackId: { type: [string, 'null'], format: uuid }
        thumbnailAssetId: { type: [string, 'null'], format: uuid }
        imageAssetIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
        customAnswers: { type: object, additionalProperties: { type: string, maxLength: 4000 } }
    PrizeInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        trackId: { type: [string, 'null'], format: uuid }
        amount: { type: [string, 'null'], maxLength: 32 }
        currency: { type: [string, 'null'], maxLength: 3 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
    PrizePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        trackId: { type: [string, 'null'], format: uuid }
        amount: { type: [string, 'null'], maxLength: 32 }
        currency: { type: [string, 'null'], maxLength: 3 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
    AssignmentGeneration:
      type: object
      required: [strategy, reviewsPerProject, judgeIds]
      properties:
        strategy: { type: string, enum: [round_robin, balanced_by_track] }
        reviewsPerProject: { type: integer, minimum: 1, maximum: 100 }
        judgeIds: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
        trackIds: { type: array, maxItems: 500, items: { type: string, format: uuid } }
        expectedProposal: { type: array, items: { type: object, required: [judgeId, projectId], properties: { judgeId: { type: string, format: uuid }, projectId: { type: string, format: uuid } } } }
        commit: { type: boolean, default: false, description: Must be true with expectedProposal to commit the proposal. }
  responses:
    JsonObject:
      description: JSON response object. Exact fields depend on the operation and are defined by the route implementation.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    ApiError:
      description: Standard API error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
