openapi: 3.1.0
info:
  title: DOGFOOD Platform API
  version: 1.0.0
  description: >-
    HTTP API exposed by this checkout, including /api/v1, operational probes, and
    the public gallery embed. Session-authenticated operations use the
    dogfood_session cookie. Error responses use the shared error envelope.
servers:
  - url: /
    description: Same-origin application server
security:
  - sessionCookie: []
tags:
  - name: Events
  - name: Gallery
  - name: Teams and projects
  - name: Judging
  - name: Voting
  - name: Prizes and certificates
  - name: Assets and exports
  - name: Webhooks
paths:
  /embed/gallery:
    get:
      operationId: getEmbeddableGallery
      tags: [Gallery]
      summary: Serve the public iframe gallery
      description: Read-only HTML widget. It uses the same q, event, track, and tag filters as the anonymous gallery API and allows framing by external sites.
      security: []
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: event, schema: { type: string, format: uuid } }
        - { in: query, name: track, schema: { type: string, format: uuid } }
        - { in: query, name: tag, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: Standalone responsive iframe widget
          content:
            text/html:
              schema: { type: string }
          headers:
            Content-Security-Policy:
              schema: { type: string }
              description: Includes frame-ancestors * and restricts scripts, styles, images, and API calls to this origin.
        '400':
          description: Invalid gallery filter
          content:
            text/plain: { schema: { type: string } }
  /api/v1/events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List visible events
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: state, schema: { type: string, enum: [DRAFT, REGISTRATION, SUBMISSIONS_OPEN, SUBMISSIONS_CLOSED, JUDGING, RESULTS_READY, PUBLISHED, ARCHIVED] } }
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createEvent
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvent' }
      responses:
        '201':
          description: Created event
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/EventSummary' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: getEvent
      tags: [Events]
      summary: Get event details and the current account roles
      security: [{}, { sessionCookie: [] }]
      responses:
        '200':
          description: Event detail, including registration windows and the current account roles.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    allOf:
                      - { $ref: '#/components/schemas/EventSummary' }
                      - type: object
                        required: [myRoles, registrationOpensAt, registrationClosesAt]
                        properties:
                          myRoles: { type: array, items: { type: string } }
                          registrationOpensAt: { type: [string, 'null'], format: date-time }
                          registrationClosesAt: { type: [string, 'null'], format: date-time }
        default: { $ref: '#/components/responses/ApiError' }
    put:
      operationId: updateEventDetails
      tags: [Events]
      summary: Replace organizer-managed event details
      description: All detail fields are required; use null to clear nullable fields. Only event organizers with configure permission may update details.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventDetails' }
      responses:
        '200':
          description: Updated event details
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    allOf:
                      - { $ref: '#/components/schemas/EventSummary' }
                      - { $ref: '#/components/schemas/UpdateEventDetails' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/registration-window:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    put:
      operationId: updateEventRegistrationWindow
      tags: [Events]
      summary: Replace an event's registration window
      description: Requires an authenticated event organizer with configure permission. Both nullable timestamps are required; send null to clear a bound. The open time must be earlier than the close time when both are set.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationOpensAt, registrationClosesAt]
              properties:
                registrationOpensAt: { type: [string, 'null'], format: date-time }
                registrationClosesAt: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Updated event and registration window
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    allOf:
                      - { $ref: '#/components/schemas/EventSummary' }
                      - type: object
                        required: [registrationOpensAt, registrationClosesAt]
                        properties:
                          registrationOpensAt: { type: [string, 'null'], format: date-time }
                          registrationClosesAt: { type: [string, 'null'], format: date-time }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/transition:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: transitionEvent
      tags: [Events]
      summary: Advance an event through the lifecycle
      description: Requires an authenticated event organizer with transition permission. The event service validates allowed state transitions and records the audit event and notifications.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toState]
              properties:
                toState: { type: string, enum: [DRAFT, REGISTRATION, SUBMISSIONS_OPEN, SUBMISSIONS_CLOSED, JUDGING, RESULTS_READY, PUBLISHED, ARCHIVED] }
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event: { $ref: '#/components/schemas/EventSummary' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/gallery:
    get:
      operationId: listGallery
      tags: [Gallery]
      summary: Search public gallery projects
      description: Anonymous; excludes draft/private projects and redacts private answers.
      security: []
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: event, schema: { type: string, format: uuid } }
        - { in: query, name: track, schema: { type: string, format: uuid } }
        - { in: query, name: tag, schema: { type: string, maxLength: 40 } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/gallery:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listEventGallery
      tags: [Gallery]
      summary: Search public projects in one event
      description: Uses the same q, track, and tag filters as the global public gallery.
      security: []
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: track, schema: { type: string, format: uuid } }
        - { in: query, name: tag, schema: { type: string, maxLength: 40 } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/gallery/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { $ref: '#/components/parameters/projectId' }
    get:
      operationId: getGalleryProject
      tags: [Gallery]
      summary: Get one publicly visible gallery project
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/teams:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: createTeam
      tags: [Teams and projects]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/teams/join:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: joinTeam
      tags: [Teams and projects]
      summary: Join a team using an invitation code
      description: Requires an authenticated account and a valid invitation code for a team in this event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [inviteCode], properties: { inviteCode: { type: string, minLength: 4, maxLength: 32 } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/teams/{teamId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTeam
      tags: [Teams and projects]
      summary: Read a team in the event
      description: Requires an authenticated account with access to the team. A team outside the event is returned as not found.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/teams/{teamId}/invitations:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createTeamInvitation
      tags: [Teams and projects]
      summary: Create an invitation for a team
      description: Requires team invitation permission. Returns the raw invitation code once; the team must belong to the event.
      responses:
        '201':
          description: Invitation code created
          content:
            application/json:
              schema: { type: object, required: [inviteCode], properties: { inviteCode: { type: string } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/teams/{teamId}/leave:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: leaveTeam
      tags: [Teams and projects]
      summary: Leave a team
      description: Requires an authenticated team member. A team outside the event is returned as not found.
      responses:
        '200':
          description: Leave request accepted
          content:
            application/json:
              schema: { type: object, required: [accepted], properties: { accepted: { const: true } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/tracks:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listEventTracks
      tags: [Events]
      summary: List tracks for an event
      description: Requires an authenticated account with event access.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: addEventTrack
      tags: [Events]
      summary: Add a track to an event
      description: Requires event configuration permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/tracks/{trackId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: trackId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateEventTrack
      tags: [Events]
      summary: Rename an event track
      description: Requires event configuration permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/tracks/{trackId}/order:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: trackId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: moveEventTrack
      tags: [Events]
      summary: Move a track up or down in the event order
      description: Requires event configuration permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [direction], properties: { direction: { type: string, enum: [UP, DOWN] } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/custom-questions:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listCustomQuestions
      tags: [Events]
      summary: List event custom questions
      description: Requires an authenticated account with event access.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: addCustomQuestion
      tags: [Events]
      summary: Add a custom submission question
      description: Requires event configuration permission. Visibility defaults to PUBLIC and required defaults to false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 300 }
                required: { type: boolean, default: false }
                visibility: { type: string, enum: [PUBLIC, ORGANIZER_ONLY] }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/custom-questions/{questionId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCustomQuestion
      tags: [Events]
      summary: Update a custom submission question
      description: Requires event configuration permission; all question fields are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, required, visibility]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 300 }
                required: { type: boolean }
                visibility: { type: string, enum: [PUBLIC, ORGANIZER_ONLY] }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/custom-questions/{questionId}/order:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: moveCustomQuestion
      tags: [Events]
      summary: Move a custom question up or down in the event order
      description: Requires event configuration permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [direction], properties: { direction: { type: string, enum: [UP, DOWN] } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/projects:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: createProject
      tags: [Teams and projects]
      summary: Create a project draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { $ref: '#/components/parameters/projectId' }
    patch:
      operationId: reviseProject
      tags: [Teams and projects]
      summary: Create a project revision
      description: Requires a member of the project's team and an open submission window. `expectedCurrentRevisionId` prevents overwriting a revision created since the client last read the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedCurrentRevisionId, title, description]
              properties:
                expectedCurrentRevisionId: { type: string, format: uuid }
                title: { type: string, maxLength: 120 }
                tagline: { type: [string, 'null'], maxLength: 280 }
                description: { type: string, maxLength: 4000 }
                repositoryUrl: { type: [string, 'null'], format: uri }
                liveUrl: { type: [string, 'null'], format: uri }
                demoVideoUrl: { type: [string, 'null'], format: uri }
                techTags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
                trackId: { type: [string, 'null'], format: uuid }
                thumbnailAssetId: { type: [string, 'null'], format: uuid }
                imageAssetIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
                customAnswers: { type: object, additionalProperties: { type: string, maxLength: 4000 } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/projects/{projectId}/submit:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { $ref: '#/components/parameters/projectId' }
    post:
      operationId: submitProject
      tags: [Teams and projects]
      summary: Submit the current project revision
      description: Requires a member of the project's team, a complete current revision, and an open submission window.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/projects/{projectId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { $ref: '#/components/parameters/projectId' }
    post:
      operationId: withdrawProject
      tags: [Teams and projects]
      summary: Withdraw a submitted project to draft
      description: Requires a member of the project's team and an open submission window. Locked projects cannot be withdrawn.
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/projects/{projectId}/lock:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { $ref: '#/components/parameters/projectId' }
    post:
      operationId: lockProject
      tags: [Teams and projects]
      summary: Lock one project against further changes
      description: Requires event configure permission. This route locks one project; bulk project locking is not exposed here.
      responses:
        '200':
          description: Project locked (or already locked)
          content:
            application/json:
              schema: { type: object, required: [accepted], properties: { accepted: { const: true } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/assets:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: uploadProjectAsset
      tags: [Assets and exports]
      summary: Upload a project image asset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: PNG or JPEG image file } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/assets/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProjectAsset
      tags: [Assets and exports]
      summary: Read an uploaded image asset
      description: Returns the asset bytes with its stored image MIME type.
      security: [{}, { sessionCookie: [] }]
      responses:
        '200': { description: Image bytes, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } } } }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/evaluations/{assignmentId}:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getEvaluation
      tags: [Judging]
      summary: Read an assigned evaluation
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    put:
      operationId: saveEvaluationDraft
      tags: [Judging]
      summary: Save an evaluation draft
      requestBody: { $ref: '#/components/requestBodies/Evaluation' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: submitEvaluation
      tags: [Judging]
      summary: Submit an evaluation
      requestBody: { $ref: '#/components/requestBodies/Evaluation' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-queue:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: getJudgeQueue
      tags: [Judging]
      summary: List the current judge's queue
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-assignments:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listJudgeAssignments
      tags: [Judging]
      summary: List assignments visible to this account
      parameters:
        - { in: query, name: judgeId, schema: { type: string, format: uuid } }
        - { in: query, name: projectId, schema: { type: string, format: uuid } }
        - { in: query, name: trackId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [ASSIGNED, IN_PROGRESS, SUBMITTED, LOCKED] } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: assignJudge
      tags: [Judging]
      summary: Assign one or more judge-project pairs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [judgeId, projectId], properties: { judgeId: { type: string, format: uuid }, projectId: { type: string, format: uuid } } }
                - { type: object, required: [assignments], properties: { assignments: { type: array, minItems: 1, maxItems: 500, items: { type: object, required: [judgeId, projectId], properties: { judgeId: { type: string, format: uuid }, projectId: { type: string, format: uuid } } } } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-assignments/generate:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    post:
      operationId: generateJudgeAssignmentProposal
      tags: [Judging]
      summary: Preview or commit a generated assignment proposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentGeneration' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-assignments/{assignmentId}:
