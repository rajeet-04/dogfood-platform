            schema: { type: object, properties: { normalizationStrategy: { type: string, enum: [z-score, none], default: z-score }, minimumBatchSize: { type: integer, minimum: 0, maximum: 1000, default: 1 }, tieBreakers: { type: array, maxItems: 8, items: { type: string, enum: [secondary-score, project-id] }, default: [secondary-score, project-id] } } }
      responses:
