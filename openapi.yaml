          application/json:
            schema: { $ref: '#/components/schemas/PairwiseChoice' }
      responses:
        '200':
          description: Saved pairwise choice
          content:
            application/json:
              schema: { type: object, required: [comparison], properties: { comparison: { $ref: '#/components/schemas/PairwiseChoice' } } }
        default: { $ref: '#/components/responses/ApiError' }
