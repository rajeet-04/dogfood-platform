      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/judge-records:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: listPublicJudgeRecords
      tags: [Judging]
      summary: List published judge participation records
      description: Publicly reads immutable issued records for this event. Each record reports signature validity separately from issuer trust. Issuer trust requires its SHA-256 SPKI fingerprint to match the deployment's JUDGE_RECORD_TRUSTED_KEY_FINGERPRINTS.
      security: []
      responses:
        '200':
          description: Published signed Ed25519 participation records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/SignedJudgeRecord' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: managePublicJudgeRecords
      tags: [Judging]
      summary: Issue, reissue, or revoke judge participation records
      description: Requires an authenticated event organizer and JUDGE_RECORD_SIGNING_PRIVATE_KEY containing an Ed25519 PKCS#8 PEM. Reissue creates a linked immutable issuance and signed revocation receipt for its predecessor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action: { const: issue }
                - type: object
                  required: [action, judgeId]
                  properties:
                    action: { const: reissue }
                    judgeId: { type: string, format: uuid }
                - type: object
                  required: [action, recordId, reason]
                  properties:
                    action: { const: revoke }
                    recordId: { type: string, format: uuid }
                    reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '201': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { description: Judge record signing is not configured }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/judge-records/{recordId}:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: verifyPublicJudgeParticipationRecord
      tags: [Judging]
      summary: Check a public judge record's current status
      description: Publicly verifies the stored signature and reports issuer trust against the deployment's independent fingerprint pins. A revoked record returns its signed revocation receipt without the original payload.
      security: []
      responses:
        '200':
          description: Active signed record and current issuer trust status
          content:
            application/json:
              schema:
                type: object
                required: [status, record, trustStatus]
                properties:
                  status: { const: published }
                  record: { $ref: '#/components/schemas/SignedJudgeRecord' }
                  trustStatus: { type: string, enum: [trusted, untrusted-key] }
        '410':
          description: Record was revoked; includes a signed receipt without the revoked payload
          content:
            application/json:
              schema:
                type: object
                required: [status, revocationReceipt, trustStatus]
                properties:
                  status: { const: revoked }
                  revocationReceipt: { $ref: '#/components/schemas/SignedJudgeRecordRevocationReceipt' }
                  trustStatus: { type: string, enum: [trusted, untrusted-key] }
        '404': { $ref: '#/components/responses/ApiError' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/pairwise-ranking:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
    get:
      operationId: getPairwiseRankingSnapshot
      tags: [Judging]
      summary: Read a persisted pairwise ranking snapshot
      description: Requires an authenticated event organizer. Unpublished snapshots are organizer-only.
      parameters:
        - { in: query, name: snapshotId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: generatePairwiseRankingSnapshot
      tags: [Judging]
      summary: Generate and persist a pairwise ranking snapshot
      description: Requires an authenticated event organizer. Uses the judges' latest saved pairwise choices; projectIds optionally limits the snapshot. The generated snapshot is immutable.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectIds: { type: array, minItems: 2, maxItems: 500, items: { type: string, format: uuid } }
                maxIterations: { type: integer, minimum: 1, maximum: 100000 }
                tolerance: { type: number, exclusiveMinimum: 0, maximum: 0.01 }
                priorWins: { type: number, exclusiveMinimum: 0, maximum: 10 }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        default: { $ref: '#/components/responses/ApiError' }
  /api/v1/events/{eventId}/pairwise-ranking/{snapshotId}/publish:
    parameters:
      - { $ref: '#/components/parameters/eventId' }
      - { name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: publishPairwiseRankingSnapshot
      tags: [Judging]
      summary: Publish a pairwise ranking snapshot as event results
      description: Requires an authenticated event organizer with results-publish permission.
      responses:
