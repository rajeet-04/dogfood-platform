# DOGFOOD 2026 official checker configuration.
# Local-only fixture credentials. Never seed or expose these in production.

[portal]
base_url = "http://localhost:3000"

[tiers]
# T1/T2: official checker 7/7 on the rebuilt Podman container (acceptance-report.txt).
# T3/T4: the checker has no probes for these tiers, so it reports them as
# "claimed but not verified". Evidence and known limits are in README.md
# ("Tier status"), THREAT-MODEL.md, plans-dogfood/API-PARITY.md, and the tests.
claimed = ["T1", "T2", "T3", "T4"]
pitch = "Self-hosted hackathon submissions, gallery, judging, and results portal with audited roles."

[auth]
organizer   = "Cookie: dogfood_session=dogfood-local-fixture-organizer-v1"
judge_a     = "Cookie: dogfood_session=dogfood-local-fixture-judge-a-v1"
judge_b     = "Cookie: dogfood_session=dogfood-local-fixture-judge-b-v1"
participant = "Cookie: dogfood_session=dogfood-local-fixture-participant-v1"

[routes]
gallery      = "/projects"
submit       = "/api/v1/events/bf768bdf-3f0a-57ca-ae94-44b36cd59727/projects"
judge_scores = "/api/v1/events/bf768bdf-3f0a-57ca-ae94-44b36cd59727/evaluations/ae78be91-e1a8-5de0-a1a4-4fee9493d41f"
peer_scores  = "/api/v1/events/bf768bdf-3f0a-57ca-ae94-44b36cd59727/evaluations/ae78be91-e1a8-5de0-a1a4-4fee9493d41f"
csv_export   = "/api/v1/events/bf768bdf-3f0a-57ca-ae94-44b36cd59727/exports/participants.csv"
