services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - dogfood-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dogfood:dogfood@db:5432/dogfood
      APP_URL: http://localhost:3000
      # Local-only fixture users and deterministic session credentials; never use in production.
      DOGFOOD_MODE: "local"
      DOGFOOD_SEED_FIXTURES: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dogfood-uploads:/app/apps/web/.uploads

volumes:
  dogfood-db:
  dogfood-uploads:
